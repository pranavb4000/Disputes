[project]
name = "dms-backend"
version = "0.1.0"
description = "Dispute Management System - FastAPI backend"
requires-python = ">=3.12"
# Exact, tested versions are pinned in requirements.txt (install from that file).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.7",
    "email-validator>=2.1",
    "sqlalchemy>=2.0.30,<2.1",
    "oracledb>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
    "pyjwt>=2.8",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "boto3>=1.34",
    "httpx2>=2.0",
]

[project.optional-dependencies]
ldap = ["ldap3>=2.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "moto[s3]>=5", "bandit>=1.7", "pip-audit>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs the real Oracle + Redis stack (docker compose)"]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["RUF012", "UP046", "UP047"]  # keep classic Generic[T] for Pydantic models

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"scripts/*" = ["S101", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["ldap3.*", "moto.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101"]  # asserts only appear in scripts/tests; ruff S101 still guards app/
