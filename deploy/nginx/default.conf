# Nginx: serves the Flutter Web build and reverse-proxies /api/ to FastAPI (TECH_STACK.md §16).
# TLS terminates at the AWS load balancer in cloud environments; locally the stack is plain HTTP.

upstream dms_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;          # largest Excel upload accepted

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # --- API --------------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://dms_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- Flutter Web app ------------------------------------------------------------------------
    # index.html and the bootstrap must never be cached, so users always get the latest build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;   # deep links like /home are handled by the Flutter router
        include /etc/nginx/snippets/security-headers.conf;
    }
}
