# Included in every location (Nginx does not inherit add_header into locations that set their own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Enable HSTS only when served over HTTPS (staging/production):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy starts in REPORT-ONLY mode so a first run on the bank laptop cannot be
# blocked by it. Check the browser console for violations, then switch the header name to
# "Content-Security-Policy" to enforce. Flutter's CanvasKit needs 'wasm-unsafe-eval'.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
