# Throwaway pubspec to check Flutter package availability in Artifactory.
# 1) Point pub at Artifactory:   set PUB_HOSTED_URL=https://<artifactory-host>/artifactory/api/pub/<pub-repo>
#    (and FLUTTER_STORAGE_BASE_URL=https://<artifactory-host>/artifactory/<flutter-storage-repo> for SDK/engine downloads)
# 2) Copy this file into an empty folder as pubspec.yaml and run:   flutter pub get
#    Then:  flutter pub deps --style=compact   > full list of transitive packages with resolved versions
# Same ranges as frontend/pubspec.yaml: pub picks the newest versions compatible with your Flutter SDK.
# (Running `flutter pub get` inside frontend/ checks exactly the same thing.)
name: dms_dependency_check
publish_to: none
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ">=2.5.1 <4.0.0"   # state management (the only approved pattern)
  go_router: ">=14.0.0 <18.0.0"        # routing + auth redirects
  dio: ^5.7.0                          # HTTP client (JWT + refresh interceptors)
  intl: ">=0.19.0 <0.21.0"             # INR / IST formatting
  data_table_2: ">=2.5.15 <3.0.0"      # data grids (server-side paging from Phase 1a)
  fl_chart: ">=0.69.0 <2.0.0"          # dashboard charts
  file_picker: ">=8.0.0 <14.0.0"       # Excel upload screen (Phase 1a); declared now to verify Artifactory
  web: ">=1.0.0 <2.0.0"                # browser APIs (downloads) on web
  json_annotation: ^4.9.0              # JSON model annotations

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

