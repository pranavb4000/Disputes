# Local development stack: Oracle XE 21 + Redis 7 + FastAPI API + worker + Nginx serving Flutter Web.
#
#   1. python tools/init_env.py                     (creates .env with random secrets)
#   2. cd frontend && flutter build web --release --no-web-resources-cdn && cd ..
#   3. docker compose up -d --build
#   4. open http://localhost:8080  and sign in as dev_user (password: DEV_USER_PASSWORD in .env)
#
# Every image name comes from .env so it can point at the bank's Artifactory registry.
# Works with Docker Compose v2 and Podman (`podman compose`). See README.md.

name: dms

services:
  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-xe:21-slim}
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Run tools/init_env.py first}
      APP_USER: ${DATABASE_USER:-dms_app}
      APP_USER_PASSWORD: ${DATABASE_PASSWORD:?Run tools/init_env.py first}
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Run tools/init_env.py first}", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-off: create/upgrade tables, then seed the dev-only login accounts.
  migrate:
    build: &backend-build
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: dms-backend:local
    env_file: .env
    environment: &backend-env
      DATABASE_HOST: oracle
      DATABASE_PORT: "1521"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_dev"]
    healthcheck:
      disable: true
    depends_on:
      oracle:
        condition: service_healthy
    restart: "no"

  api:
    image: dms-backend:local
    build: *backend-build
    env_file: .env
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: "*"   # only Nginx can reach this container on the compose network
    ports:
      - "${API_HOST_PORT:-8000}:8000"   # direct access for /api/v1/docs during development
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: dms-backend:local
    build: *backend-build
    env_file: .env
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:stable-alpine}
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      - api

volumes:
  oracle-data:
